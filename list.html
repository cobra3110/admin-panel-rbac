<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Документы</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f3f4f6; margin: 0; padding: 32px; }
        .container { max-width: 1100px; margin: 0 auto; background: #fff; padding: 24px;
                     border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { padding: 10px; border-bottom: 1px solid #e5e7eb; text-align: left; }
        th { background: #f9fafb; }
        .btn { display: inline-block; padding: 6px 12px; border-radius: 4px;
               text-decoration: none; color: #fff; font-size: 14px; border: none; cursor: pointer; }
        .btn-primary { background: #2563eb; }
        .btn-edit { background: #f59e0b; }
        .btn-danger { background: #dc2626; }
        .btn-secondary { background: #6b7280; }
        .actions { margin-bottom: 16px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Документы</h1>
    <div class="actions">
        <a th:href="@{/dashboard}" class="btn btn-secondary">Назад</a>
        <a th:href="@{/documents/new}" class="btn btn-primary"
           sec:authorize="hasAuthority('DOCUMENT_CREATE')">Добавить</a>
    </div>
    <table>
        <thead>
        <tr><th>ID</th><th>Название</th><th>Категория</th><th>Файл</th><th>Дата</th><th>Действия</th></tr>
        </thead>
        <tbody>
        <tr th:each="d : ${documents}">
            <td th:text="${d.id}"></td>
            <td th:text="${d.title}"></td>
            <td th:text="${d.category}"></td>
            <td th:text="${d.fileUrl}"></td>
            <td th:text="${d.createdDate}"></td>
            <td>
                <a th:href="@{'/documents/' + ${d.id} + '/edit'}" class="btn btn-edit"
                   sec:authorize="hasAuthority('DOCUMENT_EDIT')">Изменить</a>
                <form th:action="@{'/documents/' + ${d.id} + '/delete'}" method="post"
                      style="display:inline"
                      sec:authorize="hasAuthority('DOCUMENT_DELETE')">
                    <button type="submit" class="btn btn-danger">Удалить</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
